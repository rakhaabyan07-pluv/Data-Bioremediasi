<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard Lokasi Bioremediasi</title>
<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<!-- PapaParse untuk membaca CSV -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f6fa;color:#172033;font-family:Segoe UI,Arial,sans-serif}
header{padding:25px 30px;color:white;background:linear-gradient(135deg,#12385e,#2375a6)}
header h1{margin:0 0 5px}
header p{margin:0;opacity:.86}
.wrap{max-width:1500px;margin:auto;padding:20px}
.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:17px}
select{border:1px solid #dce3eb;border-radius:10px;padding:10px 12px;background:#fff;font-size:14px;min-width:220px}
.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(5,1fr)}
.card{background:#fff;border:1px solid #e1e7ee;border-radius:15px;padding:18px;box-shadow:0 4px 15px rgba(20,40,70,.05)}
.label{font-size:11px;color:#687487;text-transform:uppercase}
.value{font-size:28px;font-weight:800;margin:5px 0}
.sub,.desc{font-size:12px;color:#687487;line-height:1.5}
h2{font-size:17px;margin:0 0 5px}
.chart{height:300px;margin-top:10px;position:relative}
@media(max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<header>
  <h1>Dashboard Site Remediation</h1>
  <p>Monitoring TPH • Real-Time Fetch dari Publikasi CSV Google Sheets</p>
</header>
<div class="wrap">
  <div class="controls">
    <b>Pilih Lokasi:</b>
    <select id="loc"></select>
    <button id="refreshBtn" onclick="loadSheetData()" style="border:0;border-radius:10px;padding:10px 14px;background:#12385e;color:#fff;font-weight:700;cursor:pointer">🔄 Update Data</button>
    <span id="syncStatus" style="font-size:13px;color:#52606d">Memuat data CSV...</span>
  </div>

  <div id="kpis" class="grid kpis"></div>

  <section class="card" style="margin-top:16px">
    <h2>Monitoring TPH — T1, T2, T3 & Last TPH</h2>
    <p class="desc">Jumlah <b>grid ter-monitoring</b> dihitung otomatis dari baris yang terisi pada file CSV Google Sheets.</p>
    <div class="chart"><canvas id="tphChart"></canvas></div>
  </section>
</div>

<script>
// DAFTAR LINK CSV UNTUK TIAP SHEET
// Ganti URL di bawah ini dengan URL publikasi CSV dari masing-masing sheet kamu
// Gantilah bagian ini dengan URL CSV asli dari tiap-tiap sheet di Google Sheets Anda:
const CSV_URLS = {
  "4D-26":  "https://docs.google.com/spreadsheets/d/e/2PACX-1vTcaC_R_TZJBD9yL4eYoIowjLHy-bu4-BiYfplv_LZdHoELcNenvx3xu1lBeAFedw/pub?gid=0&single=true&output=csv",
  "5B-41":  "https://docs.google.com/spreadsheets/d/e/2PACX-1vTcaC_R_TZJBD9yL4eYoIowjLHy-bu4-BiYfplv_LZdHoELcNenvx3xu1lBeAFedw/pub?gid=GID_UNTUK_5B_41&single=true&output=csv",
  "5A-58B": "https://docs.google.com/spreadsheets/d/e/2PACX-1vTcaC_R_TZJBD9yL4eYoIowjLHy-bu4-BiYfplv_LZdHoELcNenvx3xu1lBeAFedw/pub?gid=GID_UNTUK_5A_58B&single=true&output=csv",
  "5C-69B": "https://docs.google.com/spreadsheets/d/e/2PACX-1vTcaC_R_TZJBD9yL4eYoIowjLHy-bu4-BiYfplv_LZdHoELcNenvx3xu1lBeAFedw/pub?gid=GID_UNTUK_5C_69B&single=true&output=csv",
  "4E-21":  "https://docs.google.com/spreadsheets/d/e/2PACX-1vTcaC_R_TZJBD9yL4eYoIowjLHy-bu4-BiYfplv_LZdHoELcNenvx3xu1lBeAFedw/pub?gid=GID_UNTUK_4E_21&single=true&output=csv",
  "5B-88":  "https://docs.google.com/spreadsheets/d/e/2PACX-1vTcaC_R_TZJBD9yL4eYoIowjLHy-bu4-BiYfplv_LZdHoELcNenvx3xu1lBeAFedw/pub?gid=GID_UNTUK_5B_88&single=true&output=csv"
};

const SHEETS = Object.keys(CSV_URLS);
let selectedLoc = SHEETS[0];
let tphChartInstance = null;

function init() {
  const select = document.getElementById("loc");
  SHEETS.forEach(s => {
    const opt = document.createElement("option");
    opt.value = s;
    opt.textContent = "LOKASI MINAS / " + s;
    select.appendChild(opt);
  });

  select.addEventListener("change", (e) => {
    selectedLoc = e.target.value;
    loadSheetData();
  });

  loadSheetData();
}

function loadSheetData() {
  const statusEl = document.getElementById("syncStatus");
  statusEl.textContent = "⏳ Membaca data CSV...";

  const csvUrl = CSV_URLS[selectedLoc];

  Papa.parse(csvUrl, {
    download: true,
    header: true, // Membaca baris pertama sebagai nama header kolom
    skipEmptyLines: true,
    complete: function(results) {
      statusEl.textContent = "✅ Data diperbarui: " + new Date().toLocaleTimeString();
      processAndRender(results.data);
    },
    error: function(err) {
      console.error(err);
      statusEl.textContent = "❌ Gagal membaca CSV. Pastikan link dipublikasikan sebagai CSV.";
    }
  });
}

function processAndRender(rows) {
  if (!rows || rows.length === 0) return;

  // Temukan nama header secara fleksibel (pencarian kata kunci)
  const firstRowKeys = Object.keys(rows[0]);
  const findKey = (keyword) => firstRowKeys.find(k => k.toUpperCase().includes(keyword.toUpperCase()));

  const keyT1   = findKey("T1");
  const keyT2   = findKey("T2");
  const keyT3   = findKey("T3");
  const keyLast = findKey("LAST") || findKey("LAST TPH");

  let countT1 = 0, countT2 = 0, countT3 = 0, countLast = 0;

  rows.forEach(row => {
    // Cek apakah sel pada kolom tersebut terisi/tidak kosong
    if (keyT1 && row[keyT1] && row[keyT1].trim() !== "") countT1++;
    if (keyT2 && row[keyT2] && row[keyT2].trim() !== "") countT2++;
    if (keyT3 && row[keyT3] && row[keyT3].trim() !== "") countT3++;
    if (keyLast && row[keyLast] && row[keyLast].trim() !== "") countLast++;
  });

  const totalGrid = rows.length;

  // Update KPI Cards
  document.getElementById("kpis").innerHTML = `
    <div class="card"><div class="label">Total Sub-Grid</div><div class="value">${totalGrid}</div><div class="sub">Total baris CSV</div></div>
    <div class="card"><div class="label">Monitoring T1</div><div class="value">${countT1}</div><div class="sub">Grid terisi</div></div>
    <div class="card"><div class="label">Monitoring T2</div><div class="value">${countT2}</div><div class="sub">Grid terisi</div></div>
    <div class="card"><div class="label">Monitoring T3</div><div class="value">${countT3}</div><div class="sub">Grid terisi</div></div>
    <div class="card"><div class="label">Last TPH</div><div class="value">${countLast}</div><div class="sub">Grid terisi</div></div>
  `;

  // Render Chart
  if (tphChartInstance) tphChartInstance.destroy();

  tphChartInstance = new Chart(document.getElementById("tphChart"), {
    type: "bar",
    data: {
      labels: ["T1", "T2", "T3", "Last TPH"],
      datasets: [{
        label: "Jumlah Grid Ter-monitoring",
        data: [countT1, countT2, countT3, countLast],
        backgroundColor: "#1c6da4",
        borderRadius: 6
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      scales: {
        y: {
          beginAtZero: true,
          title: { display: true, text: "Jumlah Grid" }
        }
      }
    }
  });
}

window.onload = init;
</script>
</body>
</html>
