<script>
// 1. URL CSV Data Utama
const CSV_URLS = {
  "4D-26":  "https://docs.google.com/spreadsheets/d/e/2PACX-1vTcaC_R_TZJBD9yL4eYoIowjLHy-bu4-BiYfplv_LZdHoELcNenvx3xu1lBeAFedw/pub?gid=935726892&single=true&output=csv",
  "5B-41":  "https://docs.google.com/spreadsheets/d/e/2PACX-1vTcaC_R_TZJBD9yL4eYoIowjLHy-bu4-BiYfplv_LZdHoELcNenvx3xu1lBeAFedw/pub?gid=1215100269&single=true&output=csv",
  "5A-58B": "https://docs.google.com/spreadsheets/d/e/2PACX-1vTcaC_R_TZJBD9yL4eYoIowjLHy-bu4-BiYfplv_LZdHoELcNenvx3xu1lBeAFedw/pub?gid=418720547&single=true&output=csv",
  "5C-69B": "https://docs.google.com/spreadsheets/d/e/2PACX-1vTcaC_R_TZJBD9yL4eYoIowjLHy-bu4-BiYfplv_LZdHoELcNenvx3xu1lBeAFedw/pub?gid=1523187989&single=true&output=csv",
  "4E-21":  "https://docs.google.com/spreadsheets/d/e/2PACX-1vTcaC_R_TZJBD9yL4eYoIowjLHy-bu4-BiYfplv_LZdHoELcNenvx3xu1lBeAFedw/pub?gid=1531056312&single=true&output=csv",
  "5B-88":  "https://docs.google.com/spreadsheets/d/e/2PACX-1vTcaC_R_TZJBD9yL4eYoIowjLHy-bu4-BiYfplv_LZdHoELcNenvx3xu1lBeAFedw/pub?gid=1245004392&single=true&output=csv"
};

// URL Khusus Sheet Foto Drone
const DRONE_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTcaC_R_TZJBD9yL4eYoIowjLHy-bu4-BiYfplv_LZdHoELcNenvx3xu1lBeAFedw/pub?gid=2008565642&single=true&output=csv";

const SHEETS = Object.keys(CSV_URLS);
let selectedLoc = SHEETS[0];
let chartInstances = {};

function init() {
  const select = document.getElementById("loc");
  SHEETS.forEach(s => {
    const opt = document.createElement("option");
    opt.value = s;
    opt.textContent = "LOKASI MINAS / " + s;
    select.appendChild(opt);
  });

  select.addEventListener("change", (e) => {
    selectedLoc = e.target.value;
    loadSheetData();
  });

  loadSheetData();
}

function loadSheetData() {
  const statusEl = document.getElementById("syncStatus");
  statusEl.textContent = "⏳ Membaca data CSV untuk " + selectedLoc + "...";

  // Load Data Kinerja Bioremediasi
  Papa.parse(CSV_URLS[selectedLoc], {
    download: true,
    header: false,
    skipEmptyLines: false,
    complete: function(results) {
      statusEl.textContent = "✅ Data terhubung (" + selectedLoc + "): " + new Date().toLocaleTimeString();
      processAndRender(results.data);
    },
    error: function(err) {
      console.error(err);
      statusEl.textContent = "❌ Gagal mengunduh CSV. Pastikan akses spreadsheet sudah publik.";
    }
  });

  // Load Data Foto Drone secara Paralel
  loadDronePhotos();
}

// Fungsi Khusus Membaca & Menampilkan Foto Drone
function loadDronePhotos() {
  const beforeContainer = document.getElementById("droneBefore");
  const afterContainer = document.getElementById("droneAfter");

  Papa.parse(DRONE_CSV_URL, {
    download: true,
    header: true,
    skipEmptyLines: true,
    complete: function(results) {
      const rows = results.data;
      
      // Cari baris foto yang sesuai dengan lokasi terpilih
      const targetRow = rows.find(r => {
        const locName = Object.values(r)[0] ? String(Object.values(r)[0]).trim().toUpperCase() : "";
        return locName === selectedLoc.toUpperCase() || locName.includes(selectedLoc.toUpperCase());
      });

      if (targetRow) {
        // Ambil nilai kolom foto (mencakup fleksibilitas nama header kolom)
        const keys = Object.keys(targetRow);
        const beforeKey = keys.find(k => k.toUpperCase().includes("SEBELUM") || k.toUpperCase().includes("BEFORE")) || keys[1];
        const afterKey = keys.find(k => k.toUpperCase().includes("SAAT") || k.toUpperCase().includes("PROG") || k.toUpperCase().includes("AFTER")) || keys[2];

        const beforeUrl = formatImageUrl(targetRow[beforeKey]);
        const afterUrl = formatImageUrl(targetRow[afterKey]);

        beforeContainer.innerHTML = beforeUrl 
          ? `<img src="${beforeUrl}" class="drone-photo" alt="Sebelum Pemulihan ${selectedLoc}">`
          : `<div class="drone-empty">Foto Udara Sebelum Pemulihan Belum Tersedia (${selectedLoc})</div>`;

        afterContainer.innerHTML = afterUrl 
          ? `<img src="${afterUrl}" class="drone-photo" alt="Saat Pemulihan ${selectedLoc}">`
          : `<div class="drone-empty">Foto Udara Saat Pemulihan Belum Tersedia (${selectedLoc})</div>`;
      } else {
        beforeContainer.innerHTML = `<div class="drone-empty">Foto Udara Sebelum Pemulihan (${selectedLoc})</div>`;
        afterContainer.innerHTML = `<div class="drone-empty">Foto Udara Saat Pemulihan (${selectedLoc})</div>`;
      }
    },
    error: function() {
      beforeContainer.innerHTML = `<div class="drone-empty">Gagal Memuat Foto (${selectedLoc})</div>`;
      afterContainer.innerHTML = `<div class="drone-empty">Gagal Memuat Foto (${selectedLoc})</div>`;
    }
  });
}

// Konversi Link Google Drive View menjadi Link Gambar Langsung
function formatImageUrl(url) {
  if (!url) return "";
  let cleanUrl = String(url).trim();
  if (cleanUrl.includes("drive.google.com") && cleanUrl.includes("/d/")) {
    const fileId = cleanUrl.split("/d/")[1].split("/")[0];
    return `https://drive.google.com/uc?export=view&id=${fileId}`;
  }
  return cleanUrl;
}

function processAndRender(rawRows) {
  if (!rawRows || rawRows.length < 7) return;

  const combinedHeaders = rawRows[0] ? rawRows[0].map((_, colIndex) => {
    return rawRows.slice(0, 6)
      .map(row => String(row[colIndex] || "").trim())
      .filter(Boolean)
      .join(" ");
  }) : [];
    
  const subHeaders = rawRows[5] ? rawRows[5].map(v => String(v || "").trim().toUpperCase()) : [];
  const midHeaders = rawRows[4] ? rawRows[4].map(v => String(v || "").trim().toUpperCase()) : [];

  const findExactCol = (exactKeywords, fallbackKeywords = []) => {
    let idx = subHeaders.findIndex(text => 
      exactKeywords.some(kw => text.replace(/[^A-Z0-9]/g, "") === kw.replace(/[^A-Z0-9]/g, ""))
    );
    if (idx !== -1) return idx;

    idx = combinedHeaders.findIndex(headerText => {
      const cleanHeader = headerText.replace(/[^a-zA-Z0-9]/g, "").toUpperCase();
      return exactKeywords.some(kw => cleanHeader.includes(kw.replace(/[^a-zA-Z0-9]/g, "").toUpperCase()));
    });
    if (idx !== -1) return idx;

    if (fallbackKeywords.length > 0) {
      return combinedHeaders.findIndex(headerText => {
        const cleanHeader = headerText.replace(/[^a-zA-Z0-9]/g, "").toUpperCase();
        return fallbackKeywords.some(kw => cleanHeader.includes(kw.replace(/[^a-zA-Z0-9]/g, "").toUpperCase()));
      });
    }

    return -1;
  };

  const idxGrid  = findExactCol(["GRIDID", "IDGRID", "GRID"]);
  const idxSub   = findExactCol(["SUBGRID", "SUB"]);
  const idxInit  = findExactCol(["INITIALTPH", "INISIALTPH"]);
  const idxInitQ = findExactCol(["INITIALQUALITY", "QUALITYINITIAL", "INITQUALITY", "INITIALQLTY", "QUALITY"]);
  const idxT1    = findExactCol(["T1"]);
  const idxT2    = findExactCol(["T2"]);
  const idxT3    = findExactCol(["T3"]);
  const idxLast  = findExactCol(["LASTTPH", "LAST"]);
  const idxProgQ = findExactCol(["PROGRESSQUALITY", "QUALITYPROGRESS", "PROGQUALITY", "LAST QLTY"]);
  const idxBioS  = findExactCol(["BIOSTIMULASI", "STIMULASI"]);
  const idxBioA  = findExactCol(["BIOAUGMENTASI", "AUGMENTASI"]);

  const idxTPC   = findExactCol(["INISIAL TPC", "INITIAL TPC", "INISIALTPC"], ["TPC"]);
  const idxSoil  = findExactCol(["INISIAL PH", "INITIAL PH", "INISIALPH", "SOIL", "SUHU", "KELEMBABAN"]);

  const idxUrea  = findExactCol(["UREA"]);
  const idxTSP   = findExactCol(["TSP"]);
  const idxDolo  = findExactCol(["DOLOMIT", "DOLOMITE"]);
  const idxKohe  = findExactCol(["KOHE"]);
  const idxBulk  = findExactCol(["BULKING", "BULKINGAGENT"]);

  const rawDataSlice = rawRows.slice(6);
  const dataRows = [];

  for (let i = 0; i < rawDataSlice.length; i++) {
    const row = rawDataSlice[i];
    const rowText = row.join(" ").toUpperCase();
    if (rowText.includes("TOTAL")) {
      break;
    }

    const gridVal = idxGrid !== -1 ? String(row[idxGrid] || "").trim() : "";
    const subVal = idxSub !== -1 ? String(row[idxSub] || "").trim() : "";

    if (gridVal !== "" || subVal !== "") {
      dataRows.push(row);
    }
  }

  const isValid = (val) => {
    if (val === null || val === undefined) return false;
    const str = String(val).trim().toUpperCase();
    return str !== "" && str !== "-" && str !== "0" && str !== "FALSE" && str !== "N/A";
  };

  let cInit = 0, cT1 = 0, cT2 = 0, cT3 = 0, cLast = 0, cBioS = 0, cBioA = 0, cTPC = 0, cSoil = 0;
  let initQ = { TKA: 0, TKB: 0, TKC: 0 };
  let progQ = { TKA: 0, TKB: 0, TKC: 0 };
  let matSum = { Urea: 0, TSP: 0, Dolomit: 0, Kohe: 0, Bulking: 0 };

  dataRows.forEach(r => {
    if (idxInit !== -1 && isValid(r[idxInit])) cInit++;
    if (idxT1 !== -1 && isValid(r[idxT1])) cT1++;
    if (idxT2 !== -1 && isValid(r[idxT2])) cT2++;
    if (idxT3 !== -1 && isValid(r[idxT3])) cT3++;
    if (idxLast !== -1 && isValid(r[idxLast])) cLast++;
    if (idxBioS !== -1 && isValid(r[idxBioS])) cBioS++;
    if (idxBioA !== -1 && isValid(r[idxBioA])) cBioA++;
    if (idxTPC !== -1 && isValid(r[idxTPC])) cTPC++;
    if (idxSoil !== -1 && isValid(r[idxSoil])) cSoil++;

    if (idxInitQ !== -1 && r[idxInitQ]) {
      const q = String(r[idxInitQ]).trim().toUpperCase();
      if (initQ[q] !== undefined) initQ[q]++;
    }
    if (idxProgQ !== -1 && r[idxProgQ]) {
      const q = String(r[idxProgQ]).trim().toUpperCase();
      if (progQ[q] !== undefined) progQ[q]++;
    }

    const parseNum = (v) => {
      if (!v) return 0;
      const n = parseFloat(String(v).replace(",", ".").replace(/[^0-9.]/g, ""));
      return isNaN(n) ? 0 : n;
    };

    if (idxUrea !== -1) matSum.Urea += parseNum(r[idxUrea]);
    if (idxTSP !== -1) matSum.TSP += parseNum(r[idxTSP]);
    if (idxDolo !== -1) matSum.Dolomit += parseNum(r[idxDolo]);
    if (idxKohe !== -1) matSum.Kohe += parseNum(r[idxKohe]);
    if (idxBulk !== -1) matSum.Bulking += parseNum(r[idxBulk]);
  });

  const totalGrid = dataRows.length;

  document.getElementById("kpis").innerHTML = `
    <div class="card"><div class="label">Total Sub-Grid</div><div class="value">${totalGrid}</div><div class="sub">Total area lokasi</div></div>
    <div class="card"><div class="label">Inisial TPH</div><div class="value">${cInit}</div><div class="sub">${Math.round(cInit/(totalGrid||1)*100)}% dari Total Grid</div></div>
    <div class="card"><div class="label">Biostimulasi</div><div class="value">${cBioS}</div><div class="sub">${Math.round(cBioS/(totalGrid||1)*100)}% dari Total Grid</div></div>
    <div class="card"><div class="label">Bioaugmentasi</div><div class="value">${cBioA}</div><div class="sub">${Math.round(cBioA/(totalGrid||1)*100)}% dari Total Grid</div></div>
    <div class="card"><div class="label">Inisial TPC</div><div class="value">${cTPC}</div><div class="sub">${Math.round(cTPC/(totalGrid||1)*100)}% dari Total Grid</div></div>
    <div class="card"><div class="label">Inisial Soil</div><div class="value">${cSoil}</div><div class="sub">${Math.round(cSoil/(totalGrid||1)*100)}% dari Total Grid</div></div>
  `;

  renderTphChart([cT1, cT2, cT3, cLast]);
  document.getElementById("stats").innerHTML = `
    <div class="stat"><b>${cT1}</b><span>Monitoring T1</span></div>
    <div class="stat"><b>${cT2}</b><span>Monitoring T2</span></div>
    <div class="stat"><b>${cT3}</b><span>Monitoring T3</span></div>
    <div class="stat"><b>${cLast}</b><span>Last TPH</span></div>
    <div class="stat"><b>${totalGrid}</b><span>Total Sub-grid</span></div>
  `;

  renderQualityCharts(initQ, progQ, totalGrid);

  document.getElementById("biostats").innerHTML = `
    <div class="bioitem"><b>${matSum.Urea.toLocaleString()}</b><span>Urea (kg)</span></div>
    <div class="bioitem"><b>${matSum.TSP.toLocaleString()}</b><span>TSP (kg)</span></div>
    <div class="bioitem"><b>${matSum.Dolomit.toLocaleString()}</b><span>Dolomit (kg)</span></div>
    <div class="bioitem"><b>${matSum.Kohe.toLocaleString()}</b><span>Kohe (kg)</span></div>
    <div class="bioitem"><b>${matSum.Bulking.toLocaleString()}</b><span>Bulking Agent (m³)</span></div>
  `;
  renderMaterialChart(matSum);

  renderProgressLists(cInit, cTPC, cSoil, cBioS, cBioA, totalGrid);

  renderTableByIndex(dataRows, {
    idxGrid, idxSub, idxInit, idxInitQ, idxT1, idxT2, idxT3, idxLast, idxProgQ, idxUrea, idxTSP, idxDolo, idxKohe, idxBulk
  });
}

function renderTphChart(dataCounts) {
  if (chartInstances.tph) chartInstances.tph.destroy();
  chartInstances.tph = new Chart(document.getElementById("tphChart"), {
    type: "bar",
    data: {
      labels: ["T1", "T2", "T3", "Last TPH"],
      datasets: [{ label: "Grid Ter-monitoring", data: dataCounts, backgroundColor: "#1c6da4", borderRadius: 6 }]
    },
    options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true } } }
  });
}

function renderQualityCharts(initQ, progQ, total) {
  const createPie = (canvasId, qData) => {
    if (chartInstances[canvasId]) chartInstances[canvasId].destroy();
    chartInstances[canvasId] = new Chart(document.getElementById(canvasId), {
      type: "doughnut",
      data: {
        labels: ["TKA", "TKB", "TKC"],
        datasets: [{ data: [qData.TKA, qData.TKB, qData.TKC], backgroundColor: ["#e74c3c", "#f39c12", "#2ecc71"] }]
      },
      options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: "bottom" } } }
    });
  };

  createPie("qualInitial", initQ);
  createPie("qualProgress", progQ);

  const createListHtml = (qData) => `
    <div class="r"><span>TKA</span><div class="bar"><i style="width:${(qData.TKA/(total||1)*100)}%;background:#e74c3c"></i></div><b>${qData.TKA}</b></div>
    <div class="r"><span>TKB</span><div class="bar"><i style="width:${(qData.TKB/(total||1)*100)}%;background:#f39c12"></i></div><b>${qData.TKB}</b></div>
    <div class="r"><span>TKC</span><div class="bar"><i style="width:${(qData.TKC/(total||1)*100)}%;background:#2ecc71"></i></div><b>${qData.TKC}</b></div>
  `;

  document.getElementById("iq").innerHTML = createListHtml(initQ);
  document.getElementById("pq").innerHTML = createListHtml(progQ);
}

function renderMaterialChart(matSum) {
  if (chartInstances.mat) chartInstances.mat.destroy();
  chartInstances.mat = new Chart(document.getElementById("matChart"), {
    type: "bar",
    data: {
      labels: ["Urea (kg)", "TSP (kg)", "Dolomit (kg)", "Kohe (kg)", "Bulking Agent (m³)"],
      datasets: [{ label: "Total Material Digunakan", data: [matSum.Urea, matSum.TSP, matSum.Dolomit, matSum.Kohe, matSum.Bulking], backgroundColor: "#2375a6", borderRadius: 6 }]
    },
    options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true } } }
  });
}

function renderProgressLists(cInit, cTPC, cSoil, cBioS, cBioA, total) {
  const t = total || 1;
  document.getElementById("stages").innerHTML = `
    <div class="r"><span>Inisial TPH</span><div class="bar"><i style="width:${(cInit/t*100)}%"></i></div><b>${cInit}/${total}</b></div>
    <div class="r"><span>Inisial TPC</span><div class="bar"><i style="width:${(cTPC/t*100)}%"></i></div><b>${cTPC}/${total}</b></div>
    <div class="r"><span>Inisial Soil</span><div class="bar"><i style="width:${(cSoil/t*100)}%"></i></div><b>${cSoil}/${total}</b></div>
  `;

  document.getElementById("extra").innerHTML = `
    <div class="r"><span>Biostimulasi</span><div class="bar"><i style="width:${(cBioS/t*100)}%"></i></div><b>${cBioS}/${total}</b></div>
    <div class="r"><span>Bioaugmentasi</span><div class="bar"><i style="width:${(cBioA/t*100)}%"></i></div><b>${cBioA}/${total}</b></div>
  `;

  document.getElementById("initialSoil").innerHTML = `
    <div class="r"><span>Inisial TPC</span><div class="bar"><i style="width:${(cTPC/t*100)}%"></i></div><b>${Math.round(cTPC/t*100)}%</b></div>
    <div class="r"><span>Inisial pH/Suhu/Kelembaban</span><div class="bar"><i style="width:${(cSoil/t*100)}%"></i></div><b>${Math.round(cSoil/t*100)}%</b></div>
  `;
}

function renderTableByIndex(rows, idxs) {
  const tbody = document.getElementById("body");
  tbody.innerHTML = "";

  const getBadge = (val) => {
    if (!val) return "-";
    const v = String(val).trim().toUpperCase();
    if (v === "TKA") return `<span class="badge tka">TKA</span>`;
    if (v === "TKB") return `<span class="badge tkb">TKB</span>`;
    if (v === "TKC") return `<span class="badge tkc">TKC</span>`;
    return val;
  };

  const getVal = (row, idx) => (idx !== -1 && row[idx]) ? row[idx] : "-";

  rows.forEach((r, idx) => {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${idx + 1}</td>
      <td>${getVal(r, idxs.idxGrid)}</td>
      <td>${getVal(r, idxs.idxSub)}</td>
      <td>${getVal(r, idxs.idxInit)}</td>
      <td>${getBadge(getVal(r, idxs.idxInitQ))}</td>
      <td>${getVal(r, idxs.idxT1)}</td>
      <td>${getVal(r, idxs.idxT2)}</td>
      <td>${getVal(r, idxs.idxT3)}</td>
      <td>${getVal(r, idxs.idxLast)}</td>
      <td>${getBadge(getVal(r, idxs.idxProgQ))}</td>
      <td>${getVal(r, idxs.idxUrea)}</td>
      <td>${getVal(r, idxs.idxTSP)}</td>
      <td>${getVal(r, idxs.idxDolo)}</td>
      <td>${getVal(r, idxs.idxKohe)}</td>
      <td>${getVal(r, idxs.idxBulk)}</td>
    `;
    tbody.appendChild(tr);
  });
}

function filterTable() {
  const query = document.getElementById("search").value.toLowerCase();
  const rows = document.querySelectorAll("#body tr");
  rows.forEach(tr => {
    const text = tr.innerText.toLowerCase();
    tr.style.display = text.includes(query) ? "" : "none";
  });
}

window.onload = init;
</script>
